name: Deploy ERP-System Admin Panel (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Create .env file from secret
        run: |
          echo "${{ secrets.STG_ENV }}" > .env

      - name: Create production build locally
        run: |
          npm install
          CI='' npm run build

      - name: Deploy build to server (Stage)
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            dist/ ${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.STG_DIR }}/